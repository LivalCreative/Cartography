    <a class="logo" href="../" aria-label="Cartography, inicio"><img src="../img/logo-cartography.png" alt="">Cartography</a>
    <a class="mi-pedido" href="../pedido/">Mi pedido <span class="n" data-contador>0</span></a>
  </div>
  <div class="luces" aria-hidden="true"><span style="left:1%"></span><span style="left:5%"></span><span style="left:9%"></span><span style="left:13%"></span><span style="left:17%"></span><span style="left:21%"></span><span style="left:25%"></span><span style="left:29%"></span><span style="left:33%"></span><span style="left:37%"></span><span style="left:41%"></span><span style="left:45%"></span><span style="left:49%"></span><span style="left:53%"></span><span style="left:57%"></span><span style="left:61%"></span><span style="left:65%"></span><span style="left:69%"></span><span style="left:73%"></span><span style="left:77%"></span><span style="left:81%"></span><span style="left:85%"></span><span style="left:89%"></span><span style="left:93%"></span><span style="left:97%"></span></div>
</header>


<main>
  <section class="seccion cat-pagina">
    <div class="wrap">
      <h1 class="cat-titulo" id="titulo">Productos</h1>
      <nav class="migas centro" aria-label="Ruta" id="migas"><a href="../">Inicio</a></nav>
      <div class="circulos" id="subcats"></div>
      <h2 class="sec" id="tituloGrid">Todo <svg class="copo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M4.2 6.5l15.6 9M4.2 17.5l15.6-9M9.5 3.5 12 6l2.5-2.5M9.5 20.5 12 18l2.5 2.5M3 9.7l3.4.9-.9 3.4M21 14.3l-3.4-.9.9-3.4M3 14.3l3.4-.9-.9-3.4M21 9.7l-3.4.9.9 3.4"/></svg></h2>
      <p class="sub" id="sub"></p>
      <div id="grid"></div>
      <div id="noEncontrado" class="caja vacio" hidden>
        <p style="margin:0 0 14px">No encontramos esta categoría.</p>
        <a class="btn" href="../#productos">Ver categorías</a>
      </div>
    </div>
  </section>

  <section class="seccion" id="otras">
    <div class="wrap">
      <h2 class="sec">Otras categorías <svg class="copo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M4.2 6.5l15.6 9M4.2 17.5l15.6-9M9.5 3.5 12 6l2.5-2.5M9.5 20.5 12 18l2.5 2.5M3 9.7l3.4.9-.9 3.4M21 14.3l-3.4-.9.9-3.4M3 14.3l3.4-.9-.9-3.4M21 9.7l-3.4.9.9 3.4"/></svg></h2>
      <div class="circulos" id="cats"></div>
    </div>
  </section>
</main>

<footer class="pie"><div class="wrap"><p class="felices">Felices fiestas</p>Cartography · Querétaro</div></footer>
<div class="aviso" id="aviso" hidden role="status"></div>

<script src="../assets/productos.js?v=10"></script>
<script src="../assets/tienda.js?v=6"></script>
<script src="../assets/comun.js?v=11"></script>
<script>
(function () {
  const C = window.CARTO, U = window.CARTO_UI, esc = U.esc, $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const c = U.catPorId(q.get("c"));
  const otras = U.CATEGORIAS.filter(x => x !== c);
  $("cats").innerHTML = otras.map(x => U.circuloHTML("./?c=" + x.id, U.fotoCategoria(x), x.nombre)).join("");
  if (!otras.length) $("otras").hidden = true;
  if (!c) { $("noEncontrado").hidden = false; $("tituloGrid").hidden = true; return; }

  const slug = s => s.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const ps = U.productosDe(c);
  const grupos = c.grupos.concat([...new Set(ps.map(p => p.grupo).filter(Boolean))].filter(g => !c.grupos.includes(g))).filter(g => ps.some(p => p.grupo === g));
  const g = grupos.find(x => slug(x) === q.get("g"));
  const base = "./?c=" + c.id;

  document.title = (g ? g + " · " : "") + c.nombre + " · Cartography";
  $("titulo").textContent = g || c.nombre;
  $("migas").innerHTML = '<a href="../">Inicio</a><span aria-hidden="true">›</span>' +
    (g ? '<a href="' + base + '">' + esc(c.nombre) + '</a><span aria-hidden="true">›</span><span>' + esc(g) + "</span>" : "<span>" + esc(c.nombre) + "</span>");
  $("subcats").innerHTML = U.circuloHTML(base, U.fotoCategoria(c), "Ver todo", !g) +
    grupos.map(x => U.circuloHTML(base + "&g=" + slug(x), U.fotoGrupo(c, x), x, x === g)).join("");

  const mostrar = g ? [g] : grupos;
  const n = ps.filter(p => !g || p.grupo === g).length;
  $("tituloGrid").firstChild.textContent = (g ? g : "Todo en " + c.nombre) + " ";
  $("sub").textContent = n + " productos. Toca uno para ver qué es y cuándo te llega.";
  $("grid").innerHTML = mostrar.map(x => {
    const lista = ps.filter(p => p.grupo === x);
    return '<div class="seccion-cat">' + (g ? "" : '<h3 class="cat">' + esc(x) + "</h3>") + '<div class="grid">' +
      lista.map(p => U.tarjetaHTML(p, "../producto/?id=")).join("") + "</div></div>";
  }).join("");
})();
</script>
</body>
</html>
